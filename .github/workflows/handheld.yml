name: Build Linux Handheld (PortMaster)

on:
  # Build the package on PRs so it can be tried on a device before release.
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (default branch when empty)
        type: string
        default: ''
      with_catalog:
        description: Download the catalog artifact and bundle it
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (default branch when empty)
        type: string
        default: ''
      with_catalog:
        description: Download the catalog artifact and bundle it
        type: boolean
        default: false

# Reusable workflows do not inherit the caller's env.
env:
  FLUTTER_VERSION: "3.35.7"
  FLUTTER_PI_COMMIT: c81869e033cd5b4c819c620e9124114a559b2067
  SERIOUS_PYTHON_APP: ${{ github.workspace }}/build/serious_python_app
  SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages

jobs:
  build-handheld:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download catalog
        if: ${{ inputs.with_catalog }}
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: assets/catalog/

      # The catalog asset dir is declared in pubspec.yaml; keep it valid when
      # the catalog is not bundled.
      - name: Ensure catalog dir
        run: mkdir -p assets/catalog

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip xz-utils zip clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libsystemd-dev libinput-dev libudev-dev libxkbcommon-dev patchelf python3 python3-venv

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b "$FLUTTER_VERSION" --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter config --enable-linux-desktop --no-analytics
          flutter --version

      # Pinned flutter-pi plus the framebuffer patch.
      - name: Build flutter-pi
        run: |
          set -euo pipefail
          git clone https://github.com/ardera/flutter-pi.git "$RUNNER_TEMP/flutter-pi"
          cd "$RUNNER_TEMP/flutter-pi"
          git checkout "$FLUTTER_PI_COMMIT"
          patch -p1 -l < "$GITHUB_WORKSPACE/linux/handheld/flutter-pi-fbdev.patch"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_VULKAN=OFF -DENABLE_OPENGL=ON \
            -DENABLE_X11=OFF -DENABLE_WAYLAND=OFF -DENABLE_SESSION_SWITCHING=OFF \
            -DENABLE_SYSTEMD=OFF -DENABLE_TESTS=OFF
          make -j"$(nproc)"
          ls -la flutter-pi

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app
        run: dart run serious_python:main package python_app/ -p Linux -r zstandard -r pycryptodome -r "retro-roster-patcher>=0.1.3"

      - name: Verify Python bundle
        run: |
          set -euo pipefail
          for p in "$SERIOUS_PYTHON_APP/main.py" "$SERIOUS_PYTHON_SITE_PACKAGES/zstandard" "$SERIOUS_PYTHON_SITE_PACKAGES/Crypto"; do
            [ -e "$p" ] || { echo "::error::$p missing - the Python bundle did not build"; exit 1; }
            echo "  ok    $p"
          done

      # Desktop chdman binaries are dead weight on a handheld.
      - name: Trim foreign chdman assets
        run: |
          for os in macos linux windows; do rm -f assets/chdman/$os/*; : > assets/chdman/$os/.gitkeep; done

      - name: Build Linux bundle (arm64)
        run: flutter build linux --release

      - name: Fetch flutter-pi engine
        run: |
          set -euo pipefail
          ENGINE=$(cat "$HOME/flutter/bin/internal/engine.version")
          echo "Engine: $ENGINE"
          cd "$RUNNER_TEMP"
          curl -fL -o engine.zip "https://github.com/ardera/flutter-engine-binaries-for-arm/archive/refs/tags/engine_$ENGINE.zip"
          unzip -q engine.zip -d engine
          find engine -maxdepth 3 | head -30
          ROOT=$(find engine -mindepth 1 -maxdepth 1 -type d | head -1)
          ls "$ROOT/arm64"
          [ -f "$ROOT/arm64/libflutter_engine.so.release" ] || { echo "::error::release engine missing for $ENGINE"; exit 1; }
          cp "$ROOT/arm64/libflutter_engine.so.release" "$RUNNER_TEMP/libflutter_engine.so"
          if [ -f "$ROOT/arm64/icudtl.dat" ]; then
            cp "$ROOT/arm64/icudtl.dat" "$RUNNER_TEMP/icudtl.dat"
          else
            cp build/linux/arm64/release/bundle/data/icudtl.dat "$RUNNER_TEMP/icudtl.dat"
          fi

      - name: Assemble port folder
        run: |
          set -euo pipefail
          BUNDLE=build/linux/arm64/release/bundle
          PORT=dist/ports/retrotoolbox
          mkdir -p "$PORT"
          # Everything except the GTK executable.
          ( cd "$BUNDLE" && tar cf - --exclude=./retro_toolbox . ) | tar xf - -C "$PORT"
          cp "$RUNNER_TEMP/flutter-pi/build/flutter-pi" "$PORT/flutter-pi"
          cp "$RUNNER_TEMP/libflutter_engine.so" "$PORT/libflutter_engine.so"
          cp "$PORT/lib/libapp.so" "$PORT/data/flutter_assets/app.so"
          cp "$RUNNER_TEMP/icudtl.dat" "$PORT/data/flutter_assets/icudtl.dat"
          cp "$RUNNER_TEMP/icudtl.dat" "$PORT/icudtl.dat"
          cp linux/handheld/retrotoolbox.gptk "$PORT/"
          cp "linux/handheld/Retro Toolbox.sh" dist/ports/
          mkdir -p "$PORT/bundled_libs"
          # Every shared library flutter-pi (and a few app extras) needs, found
          # recursively with ldd. The launcher copies one only when the
          # firmware lacks it. glibc, the C++ runtime and GPU drivers always
          # come from the device.
          SKIP='^(ld-linux.*|libc|libm|libdl|libpthread|librt|libresolv|libstdc\+\+|libgcc_s|libEGL|libGLES.*|libGL|libGLX|libGLdispatch|libmali)\.so'
          # Extras: sqlite/ffi/fonts for the app; xcb-randr for GPU blobs
          # that expect it (seen missing on Knulli).
          SEEDS="libsqlite3.so.0 libffi.so.8 libfontconfig.so.1 libfreetype.so.6 libxcb-randr.so.0"
          queue="$PORT/flutter-pi"
          for l in $SEEDS; do
            cp -L "/usr/lib/aarch64-linux-gnu/$l" "$PORT/bundled_libs/$l"
            queue="$queue /usr/lib/aarch64-linux-gnu/$l"
          done
          seen=" "
          while [ -n "$queue" ]; do
            set -- $queue; f=$1; shift; queue="$*"
            for dep in $(ldd "$f" | awk '/=> \//{print $3}'); do
              name=$(basename "$dep")
              echo "$name" | grep -Eq "$SKIP" && continue
              case "$seen" in *" $name "*) continue;; esac
              seen="$seen$name "
              cp -L "$dep" "$PORT/bundled_libs/$name"
              queue="$queue $dep"
            done
          done
          echo "bundled: $(ls "$PORT/bundled_libs" | tr '\n' ' ')"
          for l in libsystemd.so.0 libwayland-server.so.0 libxcb-randr.so.0 libinput.so.10; do
            [ -e "$PORT/bundled_libs/$l" ] || { echo "::error::$l not bundled"; exit 1; }
          done

      - name: Verify package
        run: |
          set -euo pipefail
          PORT=dist/ports/retrotoolbox
          for p in flutter-pi libflutter_engine.so data/flutter_assets/app.so app/main.py site-packages/zstandard; do
            [ -e "$PORT/$p" ] || { echo "::error::$p missing from the package"; exit 1; }
            echo "  ok    $p"
          done
          if [ -e "$PORT/data/flutter_assets/kernel_blob.bin" ]; then
            echo "::error::kernel_blob.bin present - this is not a release build"; exit 1
          fi
          echo "glibc needed by flutter-pi: $(objdump -T "$PORT/flutter-pi" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          du -sh dist/ports

      - name: Create zip
        run: cd dist && zip -qr ../retro_toolbox_handheld_arm64.zip ports

      - name: Upload handheld zip
        uses: actions/upload-artifact@v4
        with:
          name: handheld-zip
          path: retro_toolbox_handheld_arm64.zip
          retention-days: 30
