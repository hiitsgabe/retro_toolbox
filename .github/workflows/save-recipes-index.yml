name: Save recipes index

# A recipe added or fixed on main reaches every device through index.json, so
# the index is rebuilt here instead of by hand. A recipe that does not parse
# fails this job and the index stays as it was.
on:
  push:
    branches: [main]
    paths:
      - "save_recipes/**.json"
      - "!save_recipes/index.json"
  workflow_dispatch:

permissions:
  contents: write

# Two recipe pushes close together would race to push two index commits, and
# the second would be rejected. One run at a time, none cancelled.
concurrency:
  group: save-recipes-index
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run tool/save_recipe_index.dart

      # A push made with GITHUB_TOKEN starts no other workflow, so this commit
      # cannot loop back into this job or start a release.
      - name: Commit the index when it changed
        run: |
          if git diff --quiet -- save_recipes/index.json; then
            echo "index.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add save_recipes/index.json
          git commit -m "chore(save-recipes): regenerate index.json"
          # main may have moved while this ran; the index commit goes on top.
          git pull --rebase --autostash origin main
          git push
