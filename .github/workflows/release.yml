name: Build and Release

on:
  workflow_dispatch:
    branches:
      - main

env:
  FLUTTER_VERSION: "3.35.7"
  FLUTTER_CHANNEL: "stable"
  SERIOUS_PYTHON_APP: ${{ github.workspace }}/build/serious_python_app
  SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.VERSION }}
      version_name: ${{ steps.resolve.outputs.VERSION_NAME }}
      build_number: ${{ steps.resolve.outputs.BUILD_NUMBER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and bump version
        id: resolve
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT" | cut -d'+' -f2)

          IFS='.' read -r VMAJOR VMINOR VPATCH <<< "$VERSION_NAME"
          VPATCH=$((VPATCH + 1))
          if [ "$VPATCH" -gt 9 ]; then
            VPATCH=0
            VMINOR=$((VMINOR + 1))
            if [ "$VMINOR" -gt 9 ]; then
              VMINOR=0
              VMAJOR=$((VMAJOR + 1))
            fi
          fi

          NEW_VERSION_NAME="${VMAJOR}.${VMINOR}.${VPATCH}"
          NEW_BUILD_NUMBER=$((BUILD_NUMBER + 1))
          NEW_VERSION="${NEW_VERSION_NAME}+${NEW_BUILD_NUMBER}"
          TAG="v${NEW_VERSION_NAME}"

          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin main
          git tag "$TAG"
          git push origin "$TAG"

          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$NEW_BUILD_NUMBER" >> $GITHUB_OUTPUT

  download-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Download catalog
        run: |
          mkdir -p assets/catalog
          if [ -n "${{ secrets.EXAMPLE_DATA_URL }}" ]; then
            curl -L -o assets/catalog/consoles.json "${{ secrets.EXAMPLE_DATA_URL }}"
            echo "Catalog downloaded successfully"
          else
            echo "No EXAMPLE_DATA_URL secret set — skipping catalog bundle"
            echo '[]' > assets/catalog/consoles.json
          fi

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: assets/catalog/consoles.json
          retention-days: 1

  build-android:
    needs: [resolve-version, download-catalog]
    runs-on: ubuntu-latest
    steps:
      # Check out the tag created by resolve-version — the plain github.sha is
      # the pre-bump commit, which would build with the previous version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Only write key.properties when the keystore secrets are actually set.
      # Previously this ran unconditionally: KEY_STORE_PATH was empty, so the
      # redirect target became `android/` and the job died with
      # "android/: Is a directory". Without key.properties,
      # android/app/build.gradle.kts falls back to the debug signing config, so
      # an installable APK still comes out.
      - name: Apply keystore
        env:
          KEYSTORE64: ${{ secrets.KEYSTORE64 }}
          KEY_STORE_PATH: ${{ secrets.KEY_STORE_PATH }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE64" ] || [ -z "$KEY_STORE_PATH" ]; then
            echo "::warning::KEYSTORE64/KEY_STORE_PATH not set — building with debug signing."
            exit 0
          fi
          {
            echo "storeFile=$KEY_STORE_PATH"
            echo "password=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > ./android/key.properties
          echo "$KEYSTORE64" | base64 --decode > "android/$KEY_STORE_PATH"
          echo "Release signing: using the configured keystore."

      - name: Download catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: assets/catalog/

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app for Android
        run: dart run serious_python:main package python_app/ -p Android -r zstandard -r pycryptodome

      - name: Verify Python bundle
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$1/$2" ]; then
              echo "  ok    $2"
            else
              echo "::error::$2 is missing from $1 — the Python bundle did not build"
              fail=1
            fi
          }
          echo "App staging ($SERIOUS_PYTHON_APP):"
          check "$SERIOUS_PYTHON_APP" main.py
          check "$SERIOUS_PYTHON_APP" nsz
          # Unlike the desktop targets, the Android packager pip-installs once
          # per ABI into $SERIOUS_PYTHON_SITE_PACKAGES/<abi> (see the `Android`
          # entry in serious_python's package_command.dart `platforms` map), so
          # there is nothing at the site-packages root to check.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "Site packages ($abi):"
            check "$SERIOUS_PYTHON_SITE_PACKAGES/$abi" zstandard
            check "$SERIOUS_PYTHON_SITE_PACKAGES/$abi" Crypto
          done
          exit $fail

      - name: Build Android APKs (split ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Android universal APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk retro_toolbox_arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk retro_toolbox_arm32.apk
          cp build/app/outputs/flutter-apk/app-release.apk retro_toolbox_universal.apk
          cp build/app/outputs/bundle/release/app-release.aab retro_toolbox.aab

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            retro_toolbox_arm64.apk
            retro_toolbox_arm32.apk
            retro_toolbox_universal.apk
            retro_toolbox.aab
          retention-days: 30

  build-macos:
    needs: [resolve-version, download-catalog]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      # Check out the tag created by resolve-version — the plain github.sha is
      # the pre-bump commit, which would build with the previous version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: assets/catalog/

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app for macOS
        run: dart run serious_python:main package python_app/ -p Darwin -r zstandard -r pycryptodome

      - name: Verify Python bundle
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$1/$2" ]; then
              echo "  ok    $2"
            else
              echo "::error::$2 is missing from $1 — the Python bundle did not build"
              fail=1
            fi
          }
          echo "App staging ($SERIOUS_PYTHON_APP):"
          check "$SERIOUS_PYTHON_APP" main.py
          check "$SERIOUS_PYTHON_APP" nsz
          echo "Site packages ($SERIOUS_PYTHON_SITE_PACKAGES):"
          check "$SERIOUS_PYTHON_SITE_PACKAGES" zstandard
          check "$SERIOUS_PYTHON_SITE_PACKAGES" Crypto
          exit $fail

      - name: Install CocoaPods
        run: cd macos && pod install

      - name: Build macOS (${{ matrix.arch }})
        run: |
          export SP_NATIVE_SET="$(cat build/.serious_python_spm_key)"
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            flutter build macos --release --dart-define=FLUTTER_TARGET_PLATFORM=darwin-arm64
          else
            flutter build macos --release --dart-define=FLUTTER_TARGET_PLATFORM=darwin-x64
          fi

      # PRODUCT_NAME is $(TARGET_NAME) in the Xcode project, so the build emits
      # Runner.app, not "Retro Toolbox.app". Resolve whatever was produced and
      # give it the display name inside the DMG.
      - name: Create DMG (${{ matrix.arch }})
        run: |
          set -euo pipefail
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app was produced in build/macos/Build/Products/Release"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          echo "Packaging $APP"
          mkdir -p dmg_contents
          cp -R "$APP" "dmg_contents/Retro Toolbox.app"
          hdiutil create -volname "Retro Toolbox ${{ matrix.arch }}" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "retro_toolbox_macos_${{ matrix.arch }}.dmg"

      - name: Upload DMG (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: retro_toolbox_macos_${{ matrix.arch }}.dmg
          retention-days: 30

  build-linux:
    needs: [resolve-version, download-catalog]
    runs-on: ubuntu-latest
    steps:
      # Check out the tag created by resolve-version — the plain github.sha is
      # the pre-bump commit, which would build with the previous version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Download catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: assets/catalog/

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app for Linux
        run: dart run serious_python:main package python_app/ -p Linux -r zstandard -r pycryptodome

      - name: Verify Python bundle
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$1/$2" ]; then
              echo "  ok    $2"
            else
              echo "::error::$2 is missing from $1 — the Python bundle did not build"
              fail=1
            fi
          }
          echo "App staging ($SERIOUS_PYTHON_APP):"
          check "$SERIOUS_PYTHON_APP" main.py
          check "$SERIOUS_PYTHON_APP" nsz
          echo "Site packages ($SERIOUS_PYTHON_SITE_PACKAGES):"
          check "$SERIOUS_PYTHON_SITE_PACKAGES" zstandard
          check "$SERIOUS_PYTHON_SITE_PACKAGES" Crypto
          exit $fail

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # Bundle chdman (MAME tools, BSD-3) so the CHD Converter works without a
      # system install. Copies chdman plus its non-core shared libs, rpath'd to
      # $ORIGIN so they load next to the binary after extraction.
      - name: Prepare chdman (Linux)
        run: |
          set -euo pipefail
          sudo apt-get install -y mame-tools patchelf
          CH=$(command -v chdman)
          echo "chdman: $CH"
          DEST=assets/chdman/linux
          rm -f "$DEST"/.gitkeep
          mkdir -p "$DEST"
          cp "$CH" "$DEST/chdman"
          chmod u+w "$DEST/chdman"
          # Copy dependent libs, skipping the core system set the host always has.
          skip='libc\.so|libm\.so|libdl\.so|libpthread|librt\.so|libresolv|ld-linux|linux-vdso|libgcc_s|libstdc\+\+'
          ldd "$CH" | awk '/=> \//{print $3}' | while read -r lib; do
            base=$(basename "$lib")
            if echo "$base" | grep -Eq "$skip"; then continue; fi
            cp -L "$lib" "$DEST/$base"
            chmod u+w "$DEST/$base"
            patchelf --set-rpath '$ORIGIN' "$DEST/$base" || true
          done
          patchelf --set-rpath '$ORIGIN' "$DEST/chdman"
          ( cd "$DEST"; ( echo chdman; ls | grep -E '\.so' ) > manifest.txt )
          echo "Bundled:"; ls -1 "$DEST"

      - name: Build Linux (x64)
        run: flutter build linux --release

      # The bundle is relocatable but not self-describing, so the interpreter
      # and site-packages must travel with it — assert they did before shipping.
      - name: Verify Linux bundle
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          for p in roms_downloader app/main.py app/nsz site-packages/zstandard site-packages/Crypto; do
            if [ ! -e "$BUNDLE/$p" ]; then
              echo "::error::$p missing from the Linux bundle"
              exit 1
            fi
            echo "  ok    $p"
          done

      - name: Create tarball
        run: tar -czf retro_toolbox_linux_x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: retro_toolbox_linux_x64.tar.gz
          retention-days: 30

  build-windows:
    needs: [resolve-version, download-catalog]
    # windows-latest now resolves to windows-2025-vs2026, which ships Visual
    # Studio 2026. Flutter 3.35.7 only knows VS 16/17, fails to detect it, and
    # falls back to the "Visual Studio 16 2019" CMake generator — which then
    # errors with "could not find any instance of Visual Studio". Pin to the
    # VS 2022 image until the pinned Flutter version understands VS 2026.
    runs-on: windows-2022
    steps:
      # Check out the tag created by resolve-version — the plain github.sha is
      # the pre-bump commit, which would build with the previous version.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download catalog
        uses: actions/download-artifact@v4
        with:
          name: catalog
          path: assets/catalog/

      - name: Get dependencies
        run: flutter pub get

      - name: Package Python app for Windows
        run: dart run serious_python:main package python_app/ -p Windows -r zstandard -r pycryptodome

      - name: Verify Python bundle
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$1/$2" ]; then
              echo "  ok    $2"
            else
              echo "::error::$2 is missing from $1 — the Python bundle did not build"
              fail=1
            fi
          }
          echo "App staging ($SERIOUS_PYTHON_APP):"
          check "$SERIOUS_PYTHON_APP" main.py
          check "$SERIOUS_PYTHON_APP" nsz
          echo "Site packages ($SERIOUS_PYTHON_SITE_PACKAGES):"
          check "$SERIOUS_PYTHON_SITE_PACKAGES" zstandard
          check "$SERIOUS_PYTHON_SITE_PACKAGES" Crypto
          exit $fail

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Bundle chdman (MAME tools, BSD-3) so the CHD Converter works without a
      # system install. Sourced from the MAME Chocolatey package; the exe is
      # copied with any DLLs sitting next to it.
      - name: Prepare chdman (Windows)
        shell: pwsh
        run: |
          choco install mame -y --no-progress
          $exe = Get-ChildItem -Path 'C:\ProgramData\chocolatey','C:\Program Files' -Recurse -Filter chdman.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error 'chdman.exe not found after installing mame'; exit 1 }
          Write-Host "chdman: $($exe.FullName)"
          $dest = 'assets/chdman/windows'
          Remove-Item "$dest/.gitkeep" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $exe.FullName "$dest/chdman.exe"
          # chdman.exe is normally self-contained; copy any sibling DLLs just in case.
          Get-ChildItem -Path $exe.DirectoryName -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dest
          $names = @('chdman.exe') + (Get-ChildItem $dest -Filter *.dll | ForEach-Object { $_.Name })
          $names | Set-Content "$dest/manifest.txt"
          Get-ChildItem $dest | Format-Table Name,Length

      # Surfaces the detected Visual Studio install, so a future runner-image
      # change shows up here instead of as an opaque CMake generator error.
      - name: Check Windows toolchain
        run: flutter doctor -v

      - name: Build Windows (x64)
        run: flutter build windows --release

      - name: Create ZIP
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath retro_toolbox_windows_x64.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: retro_toolbox_windows_x64.zip
          retention-days: 30

  release:
    needs: [resolve-version, build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist/

      - name: Download macOS DMG (x64)
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-x64
          path: dist/

      - name: Download macOS DMG (arm64)
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-arm64
          path: dist/

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist/

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist/

      - name: Generate release notes with AI
        id: ai_notes
        run: |
          TAG=${{ needs.resolve-version.outputs.version }}
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            COMMITS=$(git log "$PREV_TAG".."$TAG" --pretty=format:"- %s" --no-merges 2>/dev/null || git log --pretty=format:"- %s" --no-merges -20)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
          fi

          echo "Commits since $PREV_TAG:"
          echo "$COMMITS"

          RESPONSE=$(curl -s -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENROUTER_API_KEY }}" \
            -d "$(jq -n \
              --arg commits "$COMMITS" \
              --arg version "$TAG" \
              '{
                "model": "minimax/minimax-m1",
                "messages": [
                  {
                    "role": "user",
                    "content": ("Generate concise release notes for " + $version + " of Retro Toolbox (a Flutter app for downloading and managing game collections). Group changes by category (New Features, Improvements, Bug Fixes). Use markdown with emoji prefixes. Be brief — one line per change, no fluff. Only include what the commits describe, do not invent features. Ignore commits that only change CI/CD pipelines, GitHub Actions workflows, README, docs, CLAUDE.md, or other non-functional changes — only include user-facing changes.\n\nCommits:\n" + $commits)
                  }
                ],
                "max_tokens": 1024
              }')")

          AI_NOTES=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$AI_NOTES" ]; then
            echo "AI generation failed, using commit list as fallback"
            AI_NOTES=$(printf "### Changes\n\n%s" "$COMMITS")
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "notes<<${EOF_MARKER}" >> $GITHUB_OUTPUT
          echo "$AI_NOTES" >> $GITHUB_OUTPUT
          echo "${EOF_MARKER}" >> $GITHUB_OUTPUT

          echo "Generated release notes:"
          echo "$AI_NOTES"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: Retro Toolbox ${{ needs.resolve-version.outputs.version }}
          body: |
            ## Retro Toolbox ${{ needs.resolve-version.outputs.version }}

            ${{ steps.ai_notes.outputs.notes || '' }}

            ---

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | 🤖 Android (arm64) | `retro_toolbox_arm64.apk` | Modern Android devices |
            | 🤖 Android (arm32) | `retro_toolbox_arm32.apk` | Older Android devices |
            | 🤖 Android (universal) | `retro_toolbox_universal.apk` | All architectures |
            | 🤖 Android (Play Store) | `retro_toolbox.aab` | App Bundle for Play Store |
            | 🍎 macOS (Apple Silicon) | `retro_toolbox_macos_arm64.dmg` | M1/M2/M3 Macs |
            | 🍎 macOS (Intel) | `retro_toolbox_macos_x64.dmg` | Intel Macs |
            | 🐧 Linux | `retro_toolbox_linux_x64.tar.gz` | Linux x64 (GTK 3) |
            | 🪟 Windows | `retro_toolbox_windows_x64.zip` | Windows x64 |

            ### Android Installation
            1. Download the APK for your device (`arm64` for most modern phones)
            2. Enable "Install from unknown sources" in your settings if needed
            3. Install the APK

            ### macOS Installation
            1. Download the DMG for your Mac
            2. Open the DMG and drag **Retro Toolbox.app** to Applications
            3. Right-click → Open on first launch to bypass Gatekeeper

            ### Linux Installation
            1. Install GTK 3 if your distribution does not ship it (`libgtk-3-0`)
            2. Extract: `tar -xzf retro_toolbox_linux_x64.tar.gz`
            3. Run `./roms_downloader`

            ### Windows Installation
            1. Download and extract `retro_toolbox_windows_x64.zip`
            2. Run `roms_downloader.exe`
          files: |
            dist/retro_toolbox_arm64.apk
            dist/retro_toolbox_arm32.apk
            dist/retro_toolbox_universal.apk
            dist/retro_toolbox.aab
            dist/retro_toolbox_macos_x64.dmg
            dist/retro_toolbox_macos_arm64.dmg
            dist/retro_toolbox_linux_x64.tar.gz
            dist/retro_toolbox_windows_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 2)
        run: |
          gh release list --json tagName --limit 100 -q '.[].tagName' | tail -n +3 | while read tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes
            git push --delete origin "$tag" 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
