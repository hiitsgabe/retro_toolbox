name: roms_downloader
description: ROMs Downloader
version: 0.1.5+15

environment:
  flutter: ">=3.35.7"
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  file_picker: ^10.3.3
  background_downloader: ^9.3.0
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  path: ^1.9.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.10+1
  permission_handler: ^12.0.1
  archive: ^4.0.7
  rar: ^0.3.0
  serious_python: ^4.5.1
  flutter_archive: ^6.0.3
  flutter_foreground_task: ^9.1.0
  package_info_plus: ^9.0.0
  cached_network_image: ^3.4.1
  rapidfuzz: ^0.1.1
  photo_view: ^0.15.0
  disk_space_2: ^1.0.11
  smb_connect: ^0.0.9
  ftpconnect: ^2.0.10
  ftp_server: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/icon.png
    - assets/boxarts/
    - assets/console_art/
    # chdman binaries are per-platform. Each <os> folder ships the binary plus
    # any sibling libs, listed in its manifest.txt. See assets/chdman/README.md.
    - assets/chdman/
    - assets/chdman/macos/
    - assets/chdman/linux/
    - assets/chdman/windows/
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
