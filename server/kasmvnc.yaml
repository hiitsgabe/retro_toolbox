# Installed as /etc/kasmvnc/kasmvnc.yaml; only what differs from (or matters on top of) the defaults.
desktop:
  allow_resize: true          # virtual screen follows the browser window

network:
  # Defaults kept: udp.public_ip is 127.0.0.1, so Xvnc never does a public STUN lookup. It still binds
  # UDP on the web port (no setting turns that off); the web client only uses it after logging in.
  ssl:
    pem_certificate: /data/.kasmvnc/cert.pem   # generated by entrypoint.sh on first boot
    pem_key: /data/.kasmvnc/key.pem
    require_ssl: true

data_loss_prevention:
  clipboard:
    server_to_client:
      enabled: true
    client_to_server:
      enabled: true

command_line:
  prompt: false               # never ask on the console (no TTY in the container)
